<!DOCTYPE html>
<html>
<head>
    <title>Ultrarun Requester</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
        {% raw %}
        <!--
        Base template for all pages.

        Purpose: Provides the HTML skeleton and links the main stylesheet.
        It also renders any Flask flash messages and exposes a `content`
        block that child templates fill in.

        Sections:
        - Flash messages: short notifications shown at the top of the page
            (e.g. 'Account created', 'Incorrect username').
        - `{% block content %}`: the main page content supplied by each
            specific template (home, profile, station, etc.).
        -->
        {% endraw %}
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p class="flash-message">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</body>
</html>
