{% extends "base.html" %}
{% block content %}

<h2>Add station for {{ run.event_name }}</h2>

<form method="post">
    <label for="name">Station name</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="distance">Distance (km)</label><br>
    <input type="text" id="distance" name="distance"><br><br>

    <label for="station_number">Station number (order)</label><br>
    <input type="number" id="station_number" name="station_number"><br><br>

    <button type="submit">Add station</button>
    <a href="{{ url_for('home', run_id=run.id) }}" style="margin-left:10px;">Cancel</a>
</form>

{% endblock %}
